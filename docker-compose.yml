services:
  postgres:
    image: postgres:15-alpine
    container_name: maintai_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: maintai_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: maintai_redis
    ports:
      - "6379:6379"

  # Faux serveur mail pour le développement : les e-mails envoyés (invitations)
  # sont visibles sur http://localhost:8025, rien ne part sur Internet.
  mailpit:
    image: axllent/mailpit:v1.21.8
    container_name: maintai_mailpit
    ports:
      - "8025:8025"

  # Met la base à jour (migrations Alembic) puis s'arrête ; api et worker attendent sa fin
  migrate:
    build: .
    container_name: maintai_migrate
    command: python -m app.db.migrate
    environment:
      - DATABASE_URL=postgresql+psycopg2://postgres:postgres@postgres:5432/maintai_db
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build: .
    container_name: maintai_api
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+psycopg2://postgres:postgres@postgres:5432/maintai_db
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=supersecretjwtkey_maintai_2026_ensam
      - SMTP_HOST=mailpit
      - SMTP_PORT=1025
      - FRONTEND_URL=http://localhost:8501
    depends_on:
      mailpit:
        condition: service_started
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_started

  worker:
    build: .
    container_name: maintai_worker
    command: celery -A app.worker.celery_app worker --loglevel=info
    environment:
      - DATABASE_URL=postgresql+psycopg2://postgres:postgres@postgres:5432/maintai_db
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=supersecretjwtkey_maintai_2026_ensam
    volumes:
      - ./models:/app/models:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_started

  # Entraînement du modèle : docker compose run --rm trainer
  trainer:
    build: .
    profiles: ["tools"]
    command: python -m ml.train
    volumes:
      - ./data:/app/data:ro
      - ./models:/app/models

  # Tests : docker compose --profile tools run --rm --build tests
  # (base de test séparée maintai_test, Redis base 15, tâches Celery exécutées directement)
  tests:
    build: .
    profiles: ["tools"]
    command: pytest -q
    environment:
      - DATABASE_URL=postgresql+psycopg2://postgres:postgres@postgres:5432/maintai_test
      - REDIS_URL=redis://redis:6379/15
      - CELERY_TASK_ALWAYS_EAGER=1
    volumes:
      - ./data:/app/data:ro
      - ./models:/app/models:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

volumes:
  postgres_data:
