version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: maintai_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: maintai_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: maintai_redis
    ports:
      - "6379:6379"

  api:
    build: .
    container_name: maintai_api
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/maintai_db
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=supersecretjwtkey_maintai_2026_ensam
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  worker:
    build: .
    container_name: maintai_worker
    command: celery -A app.worker.celery_app worker --loglevel=info
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/maintai_db
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=supersecretjwtkey_maintai_2026_ensam
    depends_on:
      - postgres
      - redis

volumes:
  postgres_data:
