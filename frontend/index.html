<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>MaintAI Cloud</title>
    <script>
      // Thème appliqué AVANT l'affichage (sinon la page clignote en blanc en mode sombre).
      // Même règle que src/theme.tsx : choix gardé, sinon réglage du système.
      try {
        var saved = localStorage.getItem("maintai.theme");
        if (saved === "dark" || (saved !== "light" && matchMedia("(prefers-color-scheme: dark)").matches)) {
          document.documentElement.classList.add("dark");
        }
      } catch (e) { /* stockage indisponible : thème clair */ }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
